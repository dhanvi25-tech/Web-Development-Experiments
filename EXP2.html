
<!DOCTYPE html>
<html>
<head>
    <title>Multimedia Webpage</title>
</head>

<body>

    <h1 align="center">My Multimedia Webpage</h1>

    <h2>Student Information Table</h2>

    <table border="1" cellpadding="10" cellspacing="0"
           width="70%" align="center">

        <tr>
            <th>Roll No.</th>
            <th>Name</th>
            <th>Course</th>
        </tr>

        <tr>
            <td>101</td>
            <td>Rahul</td>
            <td>B.Tech</td>
        </tr>

        <tr>
            <td>102</td>
            <td>Aman</td>
            <td>B.Tech</td>
        </tr>

        <tr>
            <td>103</td>
            <td>Priya</td>
            <td>B.Tech</td>
        </tr>

    </table>

    <hr>

    <h2>Audio Section</h2>

    <p>Listen to Audio:</p>

    <audio controls>
        <source src="audio.mp3" type="audio/mpeg">
        Your browser does not support audio.
    </audio>

    <hr>

    <h2>Video Section</h2>

    <p>Watch Video:</p>

    <video width="400" height="250" controls>
        <source src="video.mp4" type="video/mp4">
        Your browser does not support video.
    </video>

    <hr>

    <h2>Iframe Section</h2>

    <p>Open Google Website:</p>

    <iframe
        src="https://www.wikipedia.org"
        width="500"
        height="300"
        title="Wikipedia Website">
    </iframe>

    <hr>

    <h3 align="center">Thank You for Visiting!</h3>

</body>
</html>
